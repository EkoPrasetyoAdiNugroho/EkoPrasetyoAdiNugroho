<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" fill="none">

<style>
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.95}}
.star{animation:tw 3s ease-in-out infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
.blink{animation:blink 1.15s steps(1) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 2.4s ease-in-out infinite}
@keyframes flip{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.18)}}
.coin{transform-box:fill-box;transform-origin:center;animation:flip 1.8s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.18)}}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 1.4s ease-in-out infinite}
.t{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
</style>


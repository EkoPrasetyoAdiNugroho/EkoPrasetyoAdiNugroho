name: Refresh Stats

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate scoreboard + snake
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_USER: ${{ github.repository_owner }}
        run: |
          node scripts/gen-stats.mjs
          node scripts/gen-snake.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/contrib-game.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh scoreboard + snake [skip ci]"
            git push
          fi
